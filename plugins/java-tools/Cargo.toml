[package]
name = "java-tools"
version = "1.0.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
description = "Sample RustedJavaIDE plugin: Java helpers (getters/setters, sorting, case conversion)."

# Built on its own (not part of the IDE's workspace):
#   cargo build --release --target wasm32-unknown-unknown
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
